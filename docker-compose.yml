# URBREATH Flooding Monitoring Tool: local deployment (pre-built image, no source code needed).
#
#   docker login ghcr.io          # once, with a GitHub token that has read:packages (see README.md)
#   docker compose up -d          # start the API and the dashboard
#
# All settings are read from the .env file next to this one.

services:
  api:
    image: ghcr.io/urbreath/flooding-model:${URBREATH_VERSION:-v1.1}
    container_name: urbreath-flooding-api
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "${URBREATH_BIND_ADDRESS:-0.0.0.0}:${URBREATH_API_PORT:-8001}:8000"  # Prediction API (Swagger UI at /docs)
    environment:
      # Protects the /pipeline/* maintenance endpoints. Required: compose
      # refuses to start until it is set in .env.
      URBREATH_PIPELINE_API_KEY: ${URBREATH_PIPELINE_API_KEY:?Set URBREATH_PIPELINE_API_KEY in .env (see README.md)}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  dashboard:
    image: ghcr.io/urbreath/flooding-model:${URBREATH_VERSION:-v1.1}
    container_name: urbreath-flooding-dashboard
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true --browser.gatherUsageStats false --client.toolbarMode viewer
    ports:
      - "${URBREATH_BIND_ADDRESS:-0.0.0.0}:${URBREATH_UI_PORT:-8501}:8501"  # Flood monitoring dashboard
    environment:
      URBREATH_API_URL: http://api:8000
      # The dashboard reads live river levels from allertameteo.regione.emilia-romagna.it.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: api,localhost,127.0.0.1,${NO_PROXY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
